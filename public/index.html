<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BYTE BACK | 자료실 로그인</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101a28;
      color: #ecf4ff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 22px 64px;
    }

    .eyebrow {
      color: #8ad8df;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.2;
    }

    h2 {
      margin-top: 28px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #bfd0e5;
    }

    .notice {
      margin: 26px 0;
      padding: 18px;
      border: 1px solid #d07384;
      border-radius: 14px;
      color: #ffe3e8;
      background: #612a3544;
    }

    .panel {
      margin: 26px 0;
      padding: 20px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #172538;
    }

    .panel h2 {
      margin-top: 0;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #bfd0e5;
    }

    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #51667c;
      border-radius: 9px;
      background: #0f1926;
      color: #ecf4ff;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: #8ad8df;
      color: #10202c;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary {
      background: #25384c;
      color: #ecf4ff;
    }

    .danger {
      background: #693541;
      color: #ffe3e8;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status {
      margin-top: 14px;
      color: #bfd0e5;
    }

    .error {
      color: #ffabb9;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      display: block;
      color: #bfd0e5;
      white-space: pre-wrap;
    }

    .note-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .note-actions button {
      padding: 8px 12px;
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">
      BYTE BACK · 3단계 진짜 로그인
    </div>

    <h1>자료실 로그인</h1>

    <p>
      Supabase Auth의 이메일·비밀번호 로그인을 사용합니다.
      서버가 로그인 토큰을 검증한 요청에만 자료를 반환합니다.
    </p>

    <div class="notice">
      로그인 여부는 서버가 확인합니다.
      다만 아직 메모 소유자는 확인하지 않으므로,
      로그인한 다른 사용자가 메모 UUID를 알면 접근할 수 있는 문제가 남아 있습니다.
      이 문제는 4단계에서 막습니다.
    </div>

    <section class="panel">
      <div id="signed-out">
        <h2>로그인</h2>

        <form id="login-form">
          <label>
            이메일
            <input
              id="email"
              type="email"
              autocomplete="username"
              required
            >
          </label>

          <label>
            비밀번호
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <button
            id="login-button"
            type="submit"
          >
            로그인
          </button>
        </form>
      </div>

      <div id="signed-in" hidden>
        <h2>로그인됨</h2>

        <p id="user-state"></p>

        <button
          id="logout-button"
          class="secondary"
          type="button"
        >
          로그아웃
        </button>
      </div>

      <p
        id="auth-message"
        class="status"
        aria-live="polite"
      ></p>
    </section>

    <section
      id="note-editor"
      class="panel"
      hidden
    >
      <h2 id="editor-title">
        가상 메모 추가
      </h2>

      <form id="note-form">
        <label>
          제목
          <input
            id="note-title"
            type="text"
            maxlength="200"
            required
          >
        </label>

        <label>
          내용
          <textarea
            id="note-body"
            maxlength="4000"
            required
          ></textarea>
        </label>

        <div class="button-row">
          <button
            id="save-note-button"
            type="submit"
          >
            추가
          </button>

          <button
            id="cancel-edit-button"
            class="secondary"
            type="button"
            hidden
          >
            수정 취소
          </button>
        </div>
      </form>

      <p
        id="note-message"
        class="status"
        aria-live="polite"
      ></p>
    </section>

    <h2>가상 메모</h2>

    <ul id="notes" aria-live="polite">
      <li>로그인 상태를 확인하는 중입니다.</li>
    </ul>
  </main>

  <script type="module">
    import {
      createClient,
    } from 'https://esm.sh/@supabase/supabase-js@2.117.2';

    const SUPABASE_URL =
      'https://qzyloovynaqxfbqzhyro.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_Kdepqj-12Lf0P7ZGFDYOFA_x6QA3fTD';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
    );

    const loginForm =
      document.querySelector('#login-form');

    const emailInput =
      document.querySelector('#email');

    const passwordInput =
      document.querySelector('#password');

    const loginButton =
      document.querySelector('#login-button');

    const signedOut =
      document.querySelector('#signed-out');

    const signedIn =
      document.querySelector('#signed-in');

    const userState =
      document.querySelector('#user-state');

    const logoutButton =
      document.querySelector('#logout-button');

    const authMessage =
      document.querySelector('#auth-message');

    const noteEditor =
      document.querySelector('#note-editor');

    const noteForm =
      document.querySelector('#note-form');

    const editorTitle =
      document.querySelector('#editor-title');

    const noteTitle =
      document.querySelector('#note-title');

    const noteBody =
      document.querySelector('#note-body');

    const saveNoteButton =
      document.querySelector('#save-note-button');

    const cancelEditButton =
      document.querySelector('#cancel-edit-button');

    const noteMessage =
      document.querySelector('#note-message');

    const list =
      document.querySelector('#notes');

    let currentSession = null;
    let editingId = null;

    function setAuthMessage(
      message,
      isError = false,
    ) {
      authMessage.textContent = message;

      authMessage.classList.toggle(
        'error',
        isError,
      );
    }

    function setNoteMessage(
      message,
      isError = false,
    ) {
      noteMessage.textContent = message;

      noteMessage.classList.toggle(
        'error',
        isError,
      );
    }

    function showListMessage(message) {
      const item =
        document.createElement('li');

      item.textContent = message;

      list.replaceChildren(item);
    }

    function resetEditor() {
      editingId = null;

      noteForm.reset();

      editorTitle.textContent =
        '가상 메모 추가';

      saveNoteButton.textContent =
        '추가';

      cancelEditButton.hidden = true;
    }

    function renderSession(session) {
      currentSession = session;

      if (session?.user) {
        signedOut.hidden = true;
        signedIn.hidden = false;
        noteEditor.hidden = false;

        userState.textContent =
          `${session.user.email ?? '사용자'} 계정으로 로그인했습니다.`;

        setAuthMessage(
          '로그인 상태입니다.',
        );

        return;
      }

      signedOut.hidden = false;
      signedIn.hidden = true;
      noteEditor.hidden = true;

      userState.textContent = '';

      setAuthMessage(
        '로그인이 필요합니다.',
      );

      resetEditor();
    }

    async function authenticatedFetch(
      url,
      options = {},
    ) {
      if (!currentSession?.access_token) {
        throw new Error(
          '로그인이 필요합니다.',
        );
      }

      const headers =
        new Headers(options.headers ?? {});

      headers.set(
        'Authorization',
        `Bearer ${currentSession.access_token}`,
      );

      return fetch(url, {
        ...options,
        headers,
        cache: 'no-store',
      });
    }

    async function loadNotes(session) {
      if (!session?.access_token) {
        showListMessage(
          '로그인하면 가상 자료를 볼 수 있습니다.',
        );

        return;
      }

      showListMessage(
        '가상 자료를 불러오는 중입니다.',
      );

      try {
        const response =
          await authenticatedFetch(
            '/api/notes',
          );

        if (response.status === 401) {
          throw new Error(
            '로그인이 필요하거나 세션이 유효하지 않습니다.',
          );
        }

        if (!response.ok) {
          throw new Error(
            '자료를 읽을 수 없습니다.',
          );
        }

        const data =
          await response.json();

        if (!Array.isArray(data.notes)) {
          throw new Error(
            '자료 형식이 맞지 않습니다.',
          );
        }

        if (data.notes.length === 0) {
          showListMessage(
            '표시할 가상 메모가 없습니다.',
          );

          return;
        }

        list.replaceChildren(
          ...data.notes.map(renderNote),
        );
      } catch (error) {
        showListMessage(
          error.message
          ?? '자료를 읽을 수 없습니다.',
        );
      }
    }

    function renderNote(note) {
      const item =
        document.createElement('li');

      const title =
        document.createElement('strong');

      const body =
        document.createElement('span');

      const actions =
        document.createElement('div');

      const editButton =
        document.createElement('button');

      const deleteButton =
        document.createElement('button');

      title.textContent =
        note.title;

      body.textContent =
        note.body;

      actions.className =
        'note-actions';

      editButton.type =
        'button';

      editButton.className =
        'secondary';

      editButton.textContent =
        '수정';

      deleteButton.type =
        'button';

      deleteButton.className =
        'danger';

      deleteButton.textContent =
        '삭제';

      editButton.addEventListener(
        'click',
        () => {
          editingId = note.id;

          editorTitle.textContent =
            '가상 메모 수정';

          saveNoteButton.textContent =
            '수정 저장';

          cancelEditButton.hidden =
            false;

          noteTitle.value =
            note.title;

          noteBody.value =
            note.body;

          setNoteMessage('');

          noteTitle.focus();

          noteEditor.scrollIntoView({
            behavior: 'smooth',
            block: 'start',
          });
        },
      );

      deleteButton.addEventListener(
        'click',
        async () => {
          const confirmed =
            window.confirm(
              `"${note.title}" 메모를 삭제할까요?`,
            );

          if (!confirmed) {
            return;
          }

          deleteButton.disabled = true;

          setNoteMessage(
            '메모를 삭제하는 중입니다.',
          );

          try {
            const response =
              await authenticatedFetch(
                `/api/notes/${encodeURIComponent(note.id)}`,
                {
                  method: 'DELETE',
                },
              );

            if (response.status === 401) {
              throw new Error(
                '로그인이 필요하거나 세션이 유효하지 않습니다.',
              );
            }

            if (response.status === 404) {
              throw new Error(
                '이미 삭제되었거나 존재하지 않는 메모입니다.',
              );
            }

            if (!response.ok) {
              throw new Error(
                '메모를 삭제하지 못했습니다.',
              );
            }

            if (editingId === note.id) {
              resetEditor();
            }

            setNoteMessage(
              '메모를 삭제했습니다.',
            );

            await loadNotes(
              currentSession,
            );
          } catch (error) {
            setNoteMessage(
              error.message
              ?? '메모를 삭제하지 못했습니다.',
              true,
            );
          } finally {
            deleteButton.disabled = false;
          }
        },
      );

      actions.append(
        editButton,
        deleteButton,
      );

      item.append(
        title,
        body,
        actions,
      );

      return item;
    }

    loginForm.addEventListener(
      'submit',
      async (event) => {
        event.preventDefault();

        loginButton.disabled = true;

        setAuthMessage(
          '로그인 확인 중입니다.',
        );

        try {
          const {
            error,
          } =
            await supabase.auth.signInWithPassword({
              email:
                emailInput.value.trim(),

              password:
                passwordInput.value,
            });

          if (error) {
            throw error;
          }

          passwordInput.value = '';

          setAuthMessage(
            '로그인했습니다.',
          );
        } catch (error) {
          setAuthMessage(
            `로그인 실패: ${
              error.message
              ?? '알 수 없는 오류'
            }`,
            true,
          );
        } finally {
          loginButton.disabled =
            false;
        }
      },
    );

    logoutButton.addEventListener(
      'click',
      async () => {
        logoutButton.disabled = true;

        setAuthMessage(
          '로그아웃 중입니다.',
        );

        try {
          const {
            error,
          } =
            await supabase.auth.signOut({ scope: 'local' });

          if (error) {
            throw error;
          }

          setAuthMessage(
            '로그아웃했습니다.',
          );
        } catch (error) {
          setAuthMessage(
            `로그아웃 실패: ${
              error.message
              ?? '알 수 없는 오류'
            }`,
            true,
          );
        } finally {
          logoutButton.disabled =
            false;
        }
      },
    );

    noteForm.addEventListener(
      'submit',
      async (event) => {
        event.preventDefault();

        const title =
          noteTitle.value.trim();

        const body =
          noteBody.value.trim();

        if (!title || !body) {
          setNoteMessage(
            '제목과 내용을 모두 입력해 주세요.',
            true,
          );

          return;
        }

        saveNoteButton.disabled = true;

        try {
          if (editingId) {
            setNoteMessage(
              '메모를 수정하는 중입니다.',
            );

            const response =
              await authenticatedFetch(
                `/api/notes/${encodeURIComponent(editingId)}`,
                {
                  method: 'PUT',

                  headers: {
                    'Content-Type':
                      'application/json',
                  },

                  body: JSON.stringify({
                    title,
                    body,
                  }),
                },
              );

            if (!response.ok) {
              throw new Error(
                '메모를 수정하지 못했습니다.',
              );
            }

            setNoteMessage(
              '메모를 수정했습니다.',
            );
          } else {
            setNoteMessage(
              '메모를 추가하는 중입니다.',
            );

            const response =
              await authenticatedFetch(
                '/api/notes',
                {
                  method: 'POST',

                  headers: {
                    'Content-Type':
                      'application/json',
                  },

                  body: JSON.stringify({
                    title,
                    body,
                  }),
                },
              );

            if (!response.ok) {
              throw new Error(
                '메모를 추가하지 못했습니다.',
              );
            }

            setNoteMessage(
              '메모를 추가했습니다.',
            );
          }

          resetEditor();

          await loadNotes(
            currentSession,
          );
        } catch (error) {
          setNoteMessage(
            error.message
            ?? '메모 저장에 실패했습니다.',
            true,
          );
        } finally {
          saveNoteButton.disabled =
            false;
        }
      },
    );

    cancelEditButton.addEventListener(
      'click',
      () => {
        resetEditor();

        setNoteMessage(
          '수정을 취소했습니다.',
        );
      },
    );

    supabase.auth.onAuthStateChange(
      (_event, session) => {
        renderSession(session);

        void loadNotes(session);
      },
    );

    const {
      data: {
        session,
      },
    } =
      await supabase.auth.getSession();

    renderSession(session);

    await loadNotes(session);
  </script>
</body>
</html>
